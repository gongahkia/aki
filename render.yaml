services:
  - type: web
    runtime: docker
    name: jikai-api
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: API_DEBUG
        value: "false"
      - key: API_HOSTED_MODE
        value: "true"
      - key: API_ADMIN_KEY
        sync: false
      - key: API_CORS_ORIGINS
        value: '["https://jikai-api.onrender.com"]'
      - key: API_RATE_LIMIT
        value: "30"
      - key: API_DEMO_RATE_LIMIT
        value: "60"
      - key: API_GENERATE_RATE_LIMIT
        value: "10"
      - key: API_ADMIN_RATE_LIMIT
        value: "30"
      - key: API_RATE_LIMITER_BUCKET_TTL_SECONDS
        value: "60"
      - key: API_RATE_LIMITER_MAX_BUCKETS
        value: "2000"
      - key: API_RATE_LIMITER_CLEANUP_INTERVAL_SECONDS
        value: "30"
      - key: API_MAX_BODY_BYTES
        value: "262144"
      - key: API_GENERATE_MAX_BODY_BYTES
        value: "65536"
      - key: API_ADMIN_MAX_BODY_BYTES
        value: "1048576"
      - key: LLM_TIMEOUT
        value: "90"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: DEFAULT_PROVIDER
        value: openai
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: DATABASE_PATH
        value: /tmp/jikai.db
      - key: LOCAL_RESPONSE_CACHE_ENABLED
        value: "true"
      - key: LOCAL_RESPONSE_CACHE_TTL_SECONDS
        value: "300"
      - key: OPENAI_API_KEY
        sync: false
