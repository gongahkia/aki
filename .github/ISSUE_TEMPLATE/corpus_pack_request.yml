name: Corpus-pack request
description: Propose a source-backed corpus pack for an existing or new jurisdiction.
title: "[Corpus Pack] "
labels: ["corpus", "good-first-corpus", "phase-5"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for a concrete source or source family that could become a corpus pack.
  - type: input
    id: pack_key
    attributes:
      label: Proposed pack key
      description: Lower snake case, usually jurisdiction plus subject.
      placeholder: sg_contract
    validations:
      required: true
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      placeholder: Singapore
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Subject
      placeholder: Tort, contract, criminal law
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source URLs
      description: Include source URLs, bulk endpoints, repositories, or file paths.
      placeholder: |
        - Source:
        - Bulk/API:
        - Example record:
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Terms and redistribution
      description: Link source terms and state whether clean/raw text can be redistributed.
      placeholder: |
        Terms URL:
        Redistribution status: allowed / restricted / unknown / bundled_fixture
        Notes:
    validations:
      required: true
  - type: dropdown
    id: source_format
    attributes:
      label: Source format
      options:
        - html
        - txt
        - pdf
        - docx
        - json
        - bulk_json
        - other
    validations:
      required: true
  - type: textarea
    id: taxonomy
    attributes:
      label: Topic taxonomy
      description: List proposed topics, aliases, and subtopics.
      placeholder: |
        - negligence: duty of care, breach, causation
        - nuisance: private nuisance, public nuisance
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checks
      options:
        - label: I have not included paid, private, account-gated, or non-redistributable text.
          required: true
        - label: I can add or update a manifest under corpus/packs/<pack_key>/manifest.json.
          required: true
        - label: I can run python3 script/validate_corpus_pack.py against the manifest.
          required: true
