name: Jurisdiction request
description: Propose first-class support for a new jurisdiction.
title: "[Jurisdiction] "
labels: ["corpus", "good-first-jurisdiction", "phase-5"]
body:
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      placeholder: Australia
    validations:
      required: true
  - type: input
    id: legal_system
    attributes:
      label: Legal-system fit
      placeholder: common law, mixed, civil law
    validations:
      required: true
  - type: textarea
    id: subjects
    attributes:
      label: First useful subjects
      description: List the subjects that should ship first.
      placeholder: |
        - tort
        - contract
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Candidate legal sources
      description: Include URLs, access method, terms URL, and redistribution notes for each source.
      placeholder: |
        - Source:
          Terms:
          Access:
          Redistribution:
    validations:
      required: true
  - type: textarea
    id: localization
    attributes:
      label: Prompt and validation localization
      description: Name jurisdiction-specific authorities, citation style, terminology, or validation cues.
    validations:
      required: true
  - type: checkboxes
    id: first_task
    attributes:
      label: Starter-task fit
      options:
        - label: This can start as a manifest-only PR with source/legal review before ingestion.
          required: true
        - label: I have not pasted non-redistributable legal text into this issue.
          required: true
