name: Validation-quality report
description: Report doctrinal, jurisdictional, or study-quality problems in generated hypotheticals.
title: "[Validation] "
labels: ["validation"]
body:
  - type: dropdown
    id: failure_type
    attributes:
      label: Failure type
      options:
        - doctrinal accuracy
        - issue coverage
        - factual richness
        - explanation quality
        - difficulty calibration
        - jurisdiction fit
        - unsafe legal-advice phrasing
        - other
    validations:
      required: true
  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      placeholder: sg
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Subject
      placeholder: tort
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Generation request
      description: Include topics, difficulty, corpus pack, provider, and model when available.
      render: json
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is wrong and cite the correct rule/source if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety
      options:
        - label: This report does not include private facts, client facts, or legal advice requests.
          required: true
