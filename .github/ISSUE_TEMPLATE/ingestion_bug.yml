name: Ingestion bug
description: Report a corpus ingestion, cleaning, manifest, or validation failure.
title: "[Ingestion] "
labels: ["bug", "corpus"]
body:
  - type: input
    id: pack_key
    attributes:
      label: Corpus pack
      placeholder: sg_tort
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command that failed.
      render: sh
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Paste the relevant traceback or stderr.
      render: text
    validations:
      required: true
  - type: textarea
    id: source_context
    attributes:
      label: Source and terms context
      description: Include source URL, terms URL, and whether text redistribution is allowed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: checkboxes
    id: data_safety
    attributes:
      label: Data safety
      options:
        - label: This report does not include paid, private, account-gated, or non-redistributable text.
          required: true
