name: Jikai Benchmarks

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-eval:
    name: Weekly Eval Sweep
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - run: pip install -r requirements.txt
      - name: Run weekly benchmark sweep
        run: python3 script/run_jikai_eval.py --providers openai,anthropic --n-cases 5
      - name: Validate benchmark schema
        run: jq -e '.schema_version == "jikai.results.v1"' docs/evals/results_v1.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jikai-benchmarks-weekly
          path: |
            docs/evals/results_v1.json
            docs/evals/leaderboard.md
