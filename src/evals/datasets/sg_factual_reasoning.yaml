cases:
  - name: vr_tournament_negligence_elements
    inputs:
      facts:
        - A tournament operator knew about a dangerous move before the event.
        - A player broke her wrist while reacting to that move.
      topics:
        - negligence
        - causation
      reasoning_terms:
        - duty
        - breach
        - causation
        - damage
    expected_output:
      contains:
        - tournament
        - causation
      tort_elements:
        - duty
        - breach
        - causation
        - damage
    metadata:
      jurisdiction: SG
      category: factual_reasoning
      task_type: tort_elements

  - name: medical_negligence_allergy_elements
    inputs:
      facts:
        - A hospital team records a donor allergy but does not warn the recipient.
        - The recipient later suffers an allergic reaction.
      topics:
        - medical negligence
        - damage
      reasoning_terms:
        - duty
        - breach
        - causation
        - damage
    expected_output:
      contains:
        - hospital
        - allergic reaction
      tort_elements:
        - duty
        - breach
        - causation
        - damage
    metadata:
      jurisdiction: SG
      category: factual_reasoning
      task_type: tort_elements
